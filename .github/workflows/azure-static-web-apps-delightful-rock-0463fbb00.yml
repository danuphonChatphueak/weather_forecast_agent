
name: Deploy Flutter Web to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'weather_forecast_ui/**'
      - '.github/workflows/flutter-static-web-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: weather_forecast_ui
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: weather_forecast_ui
        run: flutter build web --release

      - name: Verify Flutter build
        run: test -f weather_forecast_ui/build/web/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.YOUR_STATIC_WEB_APP_TOKEN_SECRET }}
          action: upload
          app_location: weather_forecast_ui/build/web
          api_location: ''
          output_location: ''
          skip_app_build: true
